# WebXR Input - CI gate.
#
# The repository root is the npm workspace root; `packages/*` holds the
# publishable libraries. Work branches off `main`; `development` carries the
# preview line.
#
# Validates on every push and EVERY pull request (no branch filter, so a PR
# into `development` is gated exactly like a PR into `main`):
#   1. package build     (tsc -> dist)
#   2. strict typecheck  (src + test)
#   3. vitest with 100% coverage thresholds
#   4. verify:pack       - packs, installs into a clean project and imports,
#                          the only step that exercises the PUBLISHED artifact

# Dry run:
#   - after a pull request merges into `main` or `development` and every job
#     above passes on the merge, queue-dry-run dispatches "Publish to npm"
#     on that branch with dryRun ticked. A direct push queues nothing.

name: CI

on:
  push:
    branches:
      - main
      - development
  # No branch filter: run on every pull request, whatever its target branch,
  # so changes are always tested before they can be merged.
  pull_request:
  # Allow required-check status to be reported through merge queues, if enabled.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Nothing above this line exercises the built artifact - the tests and the
      # typecheck both resolve the package to `src` through aliases. This packs,
      # installs into a clean project and imports: the gate that catches a
      # package which builds green but ships broken.
      - name: Verify the published artifact is consumable
        run: npm run verify:pack -- --skip-build

  # ---------------------------------------------------------------------------
  # DRY RUN - after a merged pull request, queue "Publish to npm" with dryRun
  # ticked on the branch it merged into. It waits for every job above and runs
  # only when none failed. A direct push to the branch queues nothing, because
  # releases are cut from pull requests. The publish run itself is still
  # dispatched by hand when it is for real.
  # ---------------------------------------------------------------------------
  queue-dry-run:
    name: Queue publish dry run
    needs: [build-test]
    if: >-
      !cancelled()
      && !contains(needs.*.result, 'failure')
      && github.event_name == 'push'
      && (github.ref_name == 'main' || github.ref_name == 'development')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      # GITHUB_TOKEN cannot trigger most workflows, but workflow_dispatch is
      # the documented exception, so no extra secret is needed.
      - name: Dispatch the dry run if this push merged a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PR="$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq "[.[] | select(.merged_at != null and .base.ref == \"$BRANCH\")][0].number // empty")"
          if [ -z "$PR" ]; then
            echo "$SHA on $BRANCH is not a merged pull request. No dry run queued."
            exit 0
          fi
          gh workflow run publish-npm.yml --repo "$REPO" --ref "$BRANCH" -f dryRun=true
          {
            echo "## Publish dry run queued"
            echo ""
            echo "PR #$PR merged into \`$BRANCH\`, so a dry run of **Publish to npm** was dispatched on \`$BRANCH\`."
            echo "Find it in [Publish to npm](https://github.com/$REPO/actions/workflows/publish-npm.yml?query=branch%3A$BRANCH)."
          } >> "$GITHUB_STEP_SUMMARY"
